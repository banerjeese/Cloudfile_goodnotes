<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Ink</title>
<style>
:root{--bg:#d9dbe0;--bar:#1f2430;--bar2:#2c3342;--fg:#eef0f5;--acc:#5b8cff;--ok:#43c78a}
body.dk{--bg:#2b2d33}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font:15px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;color:#1b1e27}
#bar{position:fixed;left:0;top:0;transform-origin:0 0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--bar);color:var(--fg);box-shadow:0 2px 8px #0005}
#bar button{background:var(--bar2);color:var(--fg);border:1px solid #3a4256;border-radius:8px;padding:8px 12px;font:inherit;min-height:40px}
#bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#bar button:focus-visible{outline:2px solid #fff}
#save{background:var(--ok)!important;border-color:var(--ok)!important;color:#06231a!important;font-weight:600}
#save.dirty::after{content:" •"}
.sw{width:30px;min-height:30px!important;height:30px;padding:0!important;border-radius:50%!important;border:2px solid #3a4256!important}
.sw.on{border-color:#fff!important}
#cc{width:30px;height:30px;padding:0;border:2px solid #3a4256;border-radius:50%;background:none;overflow:hidden}
#szm,#szp{min-width:44px;padding:8px!important;font-weight:600}
#name{margin-left:auto;opacity:.75;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar select,#bar #tsize{background:var(--bar2);color:var(--fg);border:1px solid #3a4256;border-radius:8px;padding:8px;min-height:40px;font:inherit}
#bar #tsize{width:64px}
#browser{max-width:640px;margin:24px auto;background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 3px #0003}
#browser h2{margin:10px 12px;font-size:16px}
#browser a{display:block;padding:12px;border-radius:8px;color:inherit;text-decoration:none}
#browser a:hover,#browser a:focus-visible{background:#eef2ff}
#browser a.new{color:#1d4ed8;font-weight:600}
.row{display:flex;align-items:center;gap:4px}
.row a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .ren{border:1px solid #bbc;background:#fff;border-radius:8px;padding:8px 10px;min-height:38px;font:inherit;margin-right:4px;white-space:nowrap}
#pages{display:flex;flex-direction:column;gap:14px;padding:14px 8px 90px}
.pg{position:relative;background:#fff;box-shadow:0 1px 4px #0004;margin:0 auto;flex:none}
.pg.dk{background:#141414}
.pg canvas{display:block}
.pg.dk canvas.pdf{filter:invert(.92) hue-rotate(180deg)}
.pg .ink{position:absolute;left:0;top:0;touch-action:pan-x pan-y pinch-zoom}
.pg .ink.live{pointer-events:none}
.tbx{position:absolute;z-index:2;outline:1px dashed var(--acc);background:rgba(255,255,255,.7)}
.tbx textarea.tx{display:block;width:100%;margin:0;padding:0;border:0;outline:0;background:transparent;resize:none;overflow:hidden;line-height:1.2}
.ibx{position:absolute;z-index:2;outline:2px dashed var(--acc);touch-action:none;cursor:move}
.ibx img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.hd{position:absolute;background:var(--acc);color:#fff;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.hd.mv{left:-2px;top:-30px;width:30px;height:28px;border-radius:6px 6px 0 0;cursor:move;font-size:16px}
.hd.ok{left:30px;top:-30px;height:28px;padding:0 12px;border-radius:6px 6px 0 0;cursor:pointer;font:600 13px -apple-system,system-ui,sans-serif;white-space:nowrap;background:var(--ok);color:#06231a}
.hd.dl{left:112px;top:-30px;width:34px;height:28px;border-radius:6px 6px 0 0;cursor:pointer;background:#e5484d;font-size:14px}
.hd.rz{right:-13px;bottom:-13px;width:28px;height:28px;border-radius:50%;cursor:nwse-resize;font-size:13px}
.hd.lf,.hd.rt{top:50%;width:14px;height:34px;margin-top:-17px;border-radius:7px;cursor:ew-resize}
.hd.lf{left:-8px}.hd.rt{right:-8px}
#flip{position:fixed;left:0;top:0;transform-origin:0 0;z-index:9;width:64px;height:64px;border-radius:50%;border:0;background:var(--acc);color:#fff;font:600 13px/1.1 -apple-system,system-ui,sans-serif;box-shadow:0 2px 8px #0006;touch-action:none;user-select:none;-webkit-user-select:none}
#flip[data-t="er"]{background:#e5484d}
#toast{position:fixed;left:0;top:0;transform-origin:0 0;z-index:30;background:#111;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#pp{position:fixed;left:0;top:0;transform-origin:0 0;z-index:8;background:#fff;color:#1b1e27;border-radius:12px;padding:12px;box-shadow:0 4px 18px #0006}
#pp label{display:block;font-size:13px;margin-top:8px;opacity:.8}
#pp input[type=range]{width:100%}
#pp button{font:inherit;border:1px solid #bbc;background:#fff;border-radius:8px;padding:8px 10px;min-height:38px}
#pad{display:block;width:100%;height:110px;background:#fff;border:1px dashed #99a;border-radius:8px;touch-action:none;margin-top:10px}
.modal{position:fixed;left:0;top:0;transform-origin:0 0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:12px;max-width:920px;width:94%;max-height:90%;overflow:auto;padding:12px}
.box.small{max-width:420px}
.mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mh b{margin-right:auto}
.box button,.box select,.box input{font:inherit;border:1px solid #bbc;background:#fff;border-radius:8px;padding:8px 10px;min-height:38px}
.box button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.box label{display:block;margin:8px 0 2px;font-size:13px;opacity:.75}
.box input,.box select{width:100%}
.mh select{width:auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cell{border:1px solid #ccd;border-radius:8px;padding:6px;text-align:center;background:#f6f7fb}
.cell canvas{max-width:100%;cursor:pointer;background:#fff;box-shadow:0 1px 3px #0004}
.cell button{padding:4px 8px;min-height:32px;margin:2px}
.hide{display:none!important}
</style></head><body>
<div id="bar" class="hide">
  <button id="files">Files</button>
  <button id="pen" class="on">Pen</button>
  <button id="hl">Highlighter</button>
  <button id="tx">Text</button>
  <button id="im">Image</button>
  <button id="er">Eraser</button>
  <span id="ibar" class="hide" style="display:contents">
    <button id="ifile">📁 Choose</button><button id="ipaste">📋 Paste</button>
  </span>
  <span id="ebar" class="hide" style="display:contents">
    <button id="em0">Stroke</button><button id="em1">Pixel</button>
  </span>
  <span id="tbar" class="hide" style="display:contents">
    <select id="tfont"><option value="helv">Helvetica</option><option value="tiro">Times</option><option value="cour">Courier</option></select>
    <input id="tsize" type="number" min="4" max="300" title="Font size (pt)">
    <button id="tb"><b>B</b></button><button id="ti"><i>I</i></button><button id="tu"><u>U</u></button>
  </span>
  <button class="sw on" data-c="#111111" style="background:#111" aria-label="Black"></button>
  <button class="sw" data-c="#d62828" style="background:#d62828" aria-label="Red"></button>
  <button class="sw" data-c="#1d4ed8" style="background:#1d4ed8" aria-label="Blue"></button>
  <button class="sw" data-c="#16a34a" style="background:#16a34a" aria-label="Green"></button>
  <button class="sw" data-c="#f97316" style="background:#f97316" aria-label="Orange"></button>
  <button class="sw" data-c="#ffe600" style="background:#ffe600" aria-label="Yellow"></button>
  <input type="color" id="cc" value="#8b5cf6" aria-label="Custom colour" title="Custom colour">
  <button id="szm" aria-label="Smaller">A−</button><button id="szp" aria-label="Larger">A+</button>
  <button id="cfg">⚙ Pen</button>
  <button id="undo">Undo</button>
  <button id="dkAll" title="Dark mode for every page">🌙 All</button>
  <button id="dkPg" title="Dark mode for the current page only">🌙 Page</button>
  <button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button>
  <button id="pgs">Pages</button>
  <button id="qadd" title="Add a page after the current one">+ Page</button>
  <button id="ren">✏ Rename</button>
  <button id="save">Save to server</button>
  <span id="name"></span>
</div>
<input type="file" id="ipick" accept="image/*" class="hide">
<div id="browser"></div>
<div id="pages"></div>
<button id="flip" class="hide" data-t="pen">Pen</button>
<div id="toast"></div>

<div id="pp" class="hide">
  <div class="mh"><b>Pen settings</b><button id="ppx">✕</button></div>
  <label id="lSize">Pen thickness</label><input type="range" id="pSize" min="0" max="100">
  <label>Smoothing / stability</label><input type="range" id="pSm" min="0" max="100">
  <label>Pressure sensitivity (0 = off)</label><input type="range" id="pPr" min="0" max="100">
  <canvas id="pad"></canvas>
  <div class="mh" style="margin:10px 0 0"><button id="pclr">Clear pad</button><button id="prst">Reset</button></div>
</div>

<div id="pm" class="modal hide"><div class="box">
  <div class="mh"><b>Pages</b>
    <select id="ptpl" title="Template for new pages"><option value="blank">Blank</option><option value="lined">Lined</option><option value="grid">Grid</option><option value="dots">Dotted</option></select>
    <button id="padd" class="pri">+ Add page at end</button><button id="pclose">Close</button></div>
  <div id="grid"></div>
</div></div>

<div id="nm" class="modal hide"><div class="box small">
  <div class="mh"><b>New notebook</b></div>
  <label for="nname">Name</label><input id="nname" value="Notebook">
  <label for="ntpl">Paper</label><select id="ntpl"><option value="blank">Blank</option><option value="lined">Lined</option><option value="grid">Grid</option><option value="dots">Dotted</option></select>
  <label for="nsize">Size</label><select id="nsize"><option value="a4">A4 portrait</option><option value="a4l">A4 landscape</option><option value="a5">A5</option><option value="letter">Letter</option></select>
  <label for="npages">Pages</label><input id="npages" type="number" min="1" max="300" value="10">
  <div class="mh" style="margin-top:14px;justify-content:flex-end"><button id="ncancel">Cancel</button><button id="ncreate" class="pri">Create</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=s=>document.querySelector(s);
let cur=null,lastM=0,busy=false,drawing=false,saveTimer=null,pdf=null,zoom=1,tool="pen",color="#111111";
let strokes=[],deletes=[],views=[];   // saved items have .saved+.xref; every item has a permanent .u id; kind:"text" = text box, kind:"img" = picture
let browsePath="",editor=null,pgBusy=false,thumbTok=0,drawV=null,rtok=0,io=null;
let hist=[],inflightDel=[],editX=null,uidn=0,ger=null,elast=null;
const xmap=new Map();                  // server xref -> client id
const imgData=new Map();               // client id -> image data URL
const imgEls=new Map();                // data URL -> loaded <img>
const nu=()=>++uidn;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const MAXPIX=4.5e6;                    // max pixels per page canvas (lower = less memory)

// ---------- preferences (kept on this device)
const RG={pen:[0.0008,0.012],hl:[0.005,0.05],er:[0.008,0.09]};
const P={pen:0.0022,hl:0.012,er:0.02,smooth:0.35,press:0.55,emode:"stroke",dark:false};
const PD={...P};
let fpos={x:0.96,y:0.88};
try{const q=JSON.parse(localStorage.getItem("pdfink.prefs")||"{}");Object.assign(P,q.P||{});Object.assign(fpos,q.f||{})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem("pdfink.prefs",JSON.stringify({P,f:fpos}))}catch(e){}};

// ---------- dark mode (view only: the PDF file is never changed)
let darkAll=!!P.dark;const darkPg=new Map();
const isDark=i=>darkPg.has(i)?darkPg.get(i):darkAll;
const dpKey=()=>"pdfink.dp:"+cur;
function loadDP(){darkPg.clear();try{JSON.parse(localStorage.getItem(dpKey())||"[]").forEach(([i,b])=>darkPg.set(i,b))}catch(e){}}
function saveDP(){try{localStorage.setItem(dpKey(),JSON.stringify([...darkPg]))}catch(e){}}
const dcache=new Map();
function dcol(c){                       // ink colour as shown on a dark page: dark colours become light, hue kept
  let r=dcache.get(c);if(r)return r;
  if(!/^#[0-9a-f]{6}$/i.test(c))return c;
  const n=parseInt(c.slice(1),16),R=(n>>16&255)/255,G=(n>>8&255)/255,B=(n&255)/255;
  const mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;h*=60;if(h<0)h+=360}
  const L=Math.min(0.92,Math.max(0.62,1-l));
  r=`hsl(${h.toFixed(0)},${(s*100).toFixed(0)}%,${(L*100).toFixed(0)}%)`;
  dcache.set(c,r);return r;
}
function applyDark(v){if(!v)return;v.wrap.classList.toggle("dk",isDark(v.i));redraw(v)}
function syncDk(){$("#dkAll").classList.toggle("on",darkAll);document.body.classList.toggle("dk",darkAll);if(views.length)$("#dkPg").classList.toggle("on",isDark(curPage()))}
$("#dkAll").onclick=()=>{darkAll=!darkAll;P.dark=darkAll;darkPg.clear();savePrefs();saveDP();views.forEach(applyDark);syncDk()};
$("#dkPg").onclick=()=>{if(!views.length)return;const i=curPage();darkPg.set(i,!isDark(i));saveDP();applyDark(views[i]);syncDk()};

const TS=[0.014,0.018,0.024,0.032,0.045];
const FAM={helv:"Helvetica,Arial,sans-serif",tiro:'"Times New Roman",Times,serif',cour:'"Courier New",Courier,monospace'};
const txf={font:"helv",b:0,i:0,u:0,size:TS[2]},PW=595;
const fontStr=(s,w)=>`${s.i?"italic ":""}${s.b?"bold ":""}${s.size*w}px ${FAM[s.font||"helv"]}`;
const pending=()=>strokes.some(s=>!s.saved)||deletes.length>0;
const dirty=()=>$("#save").classList.toggle("dirty",pending());
const schedSave=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(save,3000)};
const pushHist=h=>{hist.push(h);if(hist.length>300)hist.shift()};
const merge=p=>p.filter(s=>!deletes.includes(s.xref)&&s.xref!==editX).concat(strokes.filter(s=>!s.saved));

// ---------- floating UI (bar / round button / panels follow the visible screen, even when pinch-zoomed)
function fitBar(){const b=$("#bar");document.body.style.paddingTop=(b.classList.contains("hide")?0:b.offsetHeight)+"px"}
function pinAll(){
  const vv=window.visualViewport,sc=vv?vv.scale:1,ox=vv?vv.offsetLeft:0,oy=vv?vv.offsetTop:0,
        vw=vv?vv.width:innerWidth,vh=vv?vv.height:innerHeight,s=1/sc,tr=(x,y)=>`translate(${x}px,${y}px) scale(${s})`;
  const bar=$("#bar");bar.style.width=Math.round(vw*sc)+"px";bar.style.transform=tr(ox,oy);
  const fw=64*s;$("#flip").style.transform=tr(ox+fpos.x*(vw-fw),oy+fpos.y*(vh-fw));
  const pp=$("#pp");
  if(!pp.classList.contains("hide")){const w=Math.min(Math.round(vw*sc)-16,380);pp.style.width=w+"px";pp.style.transform=tr(ox+(vw-w*s)/2,oy+vh-(pp.offsetHeight+10)*s)}
  document.querySelectorAll(".modal").forEach(m=>{m.style.width=Math.round(vw*sc)+"px";m.style.height=Math.round(vh*sc)+"px";m.style.transform=tr(ox,oy)});
  const t=$("#toast");
  if(t.classList.contains("show"))t.style.transform=tr(ox+(vw-t.offsetWidth*s)/2,oy+vh-(t.offsetHeight+20)*s);
}
let pq=0;const pinSoon=()=>{if(pq)return;pq=requestAnimationFrame(()=>{pq=0;pinAll()})};
if(window.visualViewport){
  visualViewport.addEventListener("resize",()=>{pinSoon();if(editor)setTimeout(()=>editor&&editor.reveal(),120)});
  visualViewport.addEventListener("scroll",pinSoon);
}
addEventListener("resize",pinSoon);
new ResizeObserver(fitBar).observe($("#bar"));

let toastT=0;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");pinAll();clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200)};

// ---------- file browser + rename
async function browse(path=""){
  browsePath=path;$("#pm").classList.add("hide");$("#pp").classList.add("hide");
  views.forEach(v=>deact(v,true));views=[];if(io){io.disconnect();io=null}
  $("#bar").classList.add("hide");$("#flip").classList.add("hide");$("#pages").innerHTML="";$("#browser").classList.remove("hide");fitBar();
  const items=await (await fetch("/api/list?path="+encodeURIComponent(path))).json();
  let h=`<h2>/${esc(path)}</h2><a href="#" class="new" data-n="1">➕ New notebook here</a>`;
  if(path){const up=path.split("/").slice(0,-1).join("/");h+=`<a href="#" data-d="${esc(up)}">⬆ Up</a>`}
  for(const i of items){
    if(i.dir)h+=`<a href="#" data-d="${esc(i.path)}">📁 ${esc(i.name)}</a>`;
    else h+=`<div class="row"><a href="#" data-f="${esc(i.path)}">📄 ${esc(i.name)}</a><button class="ren" data-p="${esc(i.path)}">✏ Rename</button></div>`;
  }
  if(!items.length)h+="<p style='padding:12px'>No PDFs in this folder.</p>";
  $("#browser").innerHTML=h;
}
async function renameFile(path){
  const old=path.split("/").pop().replace(/\.pdf$/i,"");
  const nn=prompt("New name for this PDF:",old);
  if(nn===null)return null;
  const name=nn.trim();
  if(!name||name===old)return null;
  try{
    const r=await fetch("/api/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path,name})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){toast(j.error||"Rename failed");return null}
    toast("Renamed");return j.path;
  }catch(e){toast("Rename failed: "+e.message);return null}
}
$("#browser").onclick=async e=>{
  const rb=e.target.closest(".ren");
  if(rb){e.preventDefault();if(await renameFile(rb.dataset.p))browse(browsePath);return}
  const a=e.target.closest("a");if(!a)return;e.preventDefault();
  a.dataset.n!==undefined?($("#nm").classList.remove("hide"),pinAll()):a.dataset.d!==undefined?browse(a.dataset.d):openPdf(a.dataset.f)};
$("#ren").onclick=async()=>{
  if(!cur)return;
  if(!await flush()){toast("Couldn't save your ink first — try again");return}
  const np=await renameFile(cur);
  if(np){
    try{const o=localStorage.getItem(dpKey());cur=np;if(o)localStorage.setItem(dpKey(),o)}catch(e){cur=np}
    $("#name").textContent=np.split("/").pop();
  }
};

// ---- new notebook
$("#ncancel").onclick=()=>$("#nm").classList.add("hide");
$("#ncreate").onclick=async()=>{
  try{
    const r=await fetch("/api/new",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      folder:browsePath,name:$("#nname").value,template:$("#ntpl").value,size:$("#nsize").value,pages:+$("#npages").value||1})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){toast(j.error||"Could not create notebook");return}
    $("#nm").classList.add("hide");openPdf(j.path);
  }catch(e){toast("Create failed: "+e.message)}
};

// fetch ink saved in the PDF as editable items (each gets a stable client id via xmap)
const blobToURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
async function pull(){
  const j=await (await fetch("/api/strokes?path="+encodeURIComponent(cur)+"&t="+Date.now())).json();
  lastM=j.m;
  const out=j.strokes.map(s=>{let u=xmap.get(s.xref);if(!u){u=nu();xmap.set(s.xref,u)}return{...s,saved:true,u}});
  await Promise.all(out.filter(s=>s.kind==="img").map(async s=>{
    if(!imgData.has(s.u)){
      try{
        const r=await fetch("/api/img?path="+encodeURIComponent(cur)+"&xref="+s.xref+"&t="+Date.now());
        if(r.ok)imgData.set(s.u,await blobToURL(await r.blob()));
      }catch(e){}
    }
    s.data=imgData.get(s.u);
  }));
  return out.filter(s=>s.kind!=="img"||s.data);
}
const redrawAll=()=>views.forEach(redraw);

async function openPdf(path){
  if(pending()&&!confirm("Discard unsaved ink?"))return;
  cur=path;strokes=[];deletes=[];hist=[];xmap.clear();imgData.clear();editX=null;dirty();
  darkAll=!!P.dark;loadDP();syncDk();
  $("#browser").classList.add("hide");$("#bar").classList.remove("hide");$("#flip").classList.remove("hide");
  $("#name").textContent=path.split("/").pop();
  fitBar();pinAll();
  pdf=await pdfjsLib.getDocument("/api/file?path="+encodeURIComponent(path)+"&t="+Date.now()).promise;
  strokes=merge(await pull());
  await render();
}

// ---------- pages are only drawn while they're near the screen (this is what keeps RAM/CPU low)
async function render(){
  closeText();const tok=++rtok;

function hitS(v,s,x,y,r){
  if(s.kind==="text"){const b=textBox(v.ctx,s,v.w,v.h),px=x*v.w,py=y*v.h,m=r*v.w*0.5;
    return px>=b.x-m&&px<=b.x+b.w+m&&py>=b.y-m&&py<=b.y+b.h+m}
  const a=v.h/v.w,p=s.pts,bb=bbox(s);
  if(x<bb[0]-r||x>bb[2]+r||y*a<bb[1]*a-r||y*a>bb[3]*a+r)return false;      // quick reject
  for(let k=1;k<p.length;k++)if(dseg(x,y*a,p[k-1][0],p[k-1][1]*a,p[k][0],p[k][1]*a)<r)return true;
  return false;
}
function gRemove(s){
  if(ger.add.has(s.u))ger.add.delete(s.u);else ger.rem.set(s.u,{...s});
  removeStroke(s.u);
}
function cut(s,x,y,r,asp){
  const step=r*0.5,pts=s.pts,out=[];
  for(let k=0;k<pts.length;k++){
    out.push(pts[k]);
    if(k<pts.length-1){
      const d=Math.hypot(pts[k+1][0]-pts[k][0],(pts[k+1][1]-pts[k][1])*asp),n=Math.ceil(d/step);
      for(let j=1;j<n;j++){const t=j/n;out.push([pts[k][0]+(pts[k+1][0]-pts[k][0])*t,pts[k][1]+(pts[k+1][1]-pts[k][1])*t])}
    }
  }
  const runs=[];let c=[],removed=false;
  for(const q of out){
    if(Math.hypot(q[0]-x,(q[1]-y)*asp)<r){removed=true;if(c.length>1)runs.push(c);c=[]}else c.push(q);
  }
  if(c.length>1)runs.push(c);
  return removed?runs:null;
}
function eraseAt(v,[x,y]){
  const r=P.er,asp=v.h/v.w;let ch=false;
  const hits=strokes.filter(s=>s.page===v.i&&s.kind!=="img"&&hitS(v,s,x,y,r));    // pictures are never erased (use 🗑 in the Image tool)
  for(const s of hits){
    if(s.kind==="text"||P.emode==="stroke"){gRemove(s);ch=true;continue}
    const runs=cut(s,x,y,r,asp);if(!runs)continue;
    gRemove(s);
    runs.forEach(p=>{const n={u:nu(),page:s.page,color:s.color,w:s.w,a:s.a,pts:p};strokes.push(n);ger.add.add(n.u)});
    ch=true;
  }
  if(ch){redraw(v);dirty()}
}
function eraseMove(v,p){
  const l=elast;elast=p;
  if(!l)return eraseAt(v,p);
  const d=Math.hypot(p[0]-l[0],(p[1]-l[1])*v.h/v.w),n=Math.max(1,Math.ceil(d/(P.er*0.5)));
  for(let k=1;k<=n;k++)eraseAt(v,[l[0]+(p[0]-l[0])*k/n,l[1]+(p[1]-l[1])*k/n]);
}

function attach(v){
  const el=v.ink;let s=null,tx0=null,R=null;
  const pos=e=>{const r=R||el.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  const pr=e=>e.pressure>0?e.pressure:0.5;
  const block=e=>{if(e.touches[0]&&e.touches[0].touchType==="stylus")e.preventDefault()};
  el.addEventListener("touchstart",block,{passive:false});el.addEventListener("touchmove",block,{passive:false});
  el.addEventListener("touchend",e=>{if(tool==="tx"||tool==="im")e.preventDefault()},{passive:false});
  el.addEventListener("pointerdown",e=>{
    if(tool==="tx"||tool==="im"){tx0={x:e.clientX,y:e.clientY};if(e.pointerType!=="touch")e.preventDefault();return}
    if(e.pointerType==="touch")return;
    closeText();
    el.setPointerCapture(e.pointerId);drawing=true;drawV=v;R=el.getBoundingClientRect();clearTimeout(saveTimer);
    if(tool==="er"){ger={rem:new Map(),add:new Set()};elast=null;eraseMove(v,pos(e));s="erase";return}
    s=mkStroke(tool,v.i);addPt(s,pos(e),pr(e));strokes.push(s);
    s.a<1?liveHL(v,s):livePen(v,s);
  });
  el.addEventListener("pointermove",e=>{
    if(!s)return;
    if(s==="erase"){eraseMove(v,pos(e));return}
    for(const ev of(e.getCoalescedEvents?e.getCoalescedEvents():[e]))addPt(s,pos(ev),pr(ev));
    s.a<1?liveHL(v,s):livePen(v,s);
  });
  const end=()=>{if(!s)return;
    if(s==="erase"){
      if(ger&&(ger.rem.size||ger.add.size))pushHist({k:"er",rem:[...ger.rem.values()],add:[...ger.add]});
      ger=null;elast=null;
    }else{
      const d=s;catchUp(d);
      strokes=strokes.filter(t=>t!==d);
      const parts=finalize(d);
      parts.forEach(p=>strokes.push(p));
      if(parts.length)pushHist({k:"add",items:parts});
    }
    if(v.live){v.live.width=v.live.height=0;v.live.remove();v.live=null;v.lctx=null}
    s=null;R=null;drawing=false;drawV=null;redraw(v);dirty();schedSave()};
  el.addEventListener("pointerup",e=>{
    if((tool==="tx"||tool==="im")&&tx0){const m=Math.hypot(e.clientX-tx0.x,e.clientY-tx0.y);tx0=null;
      if(m<=8){
        const p=pos(e);
        if(tool==="tx")openText(v,p,hitText(v,p));
        else{const h=hitImg(v,p);if(h)openImage(v,h,false);else closeText()}
      }
      return}
    end();
  });
  el.addEventListener("pointercancel",()=>{tx0=null;end()});
}

// ---- tools / colours / sizes
function pick(c){color=c;document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",b.dataset.c===c));if(editor)editor.set({color:c})}
function setTool(t){
  if(editor&&editor.kind!==(t==="im"?"img":t==="tx"?"txt":""))closeText();
  tool=t;
  $("#tbar").classList.toggle("hide",t!=="tx");
  $("#ebar").classList.toggle("hide",t!=="er");
  $("#ibar").classList.toggle("hide",t!=="im");
  const L={er:"Eraser",hl:"Marker",tx:"Text",pen:"Pen",im:"Image"},f=$("#flip");
  f.textContent=L[t]||"Pen";f.dataset.t=t;
  ["pen","hl","tx","er","im"].forEach(k=>$("#"+k).classList.toggle("on",k===t));
  if(t==="hl"&&color==="#111111")pick("#ffe600");
  if(t==="tx"&&color==="#ffe600")pick("#111111");

}
$("#pen").onclick=()=>setTool("pen");$("#hl").onclick=()=>setTool("hl");$("#tx").onclick=()=>setTool("tx");$("#er").onclick=()=>setTool("er");$("#im").onclick=()=>setTool("im");
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{pick(b.dataset.c);if(tool==="er")setTool("pen")});
$("#cc").oninput=e=>{pick(e.target.value);if(tool==="er")setTool("pen")};

// image buttons: choose a file / paste from clipboard / Ctrl+V
$("#ifile").onclick=()=>$("#ipick").click();
$("#ipick").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f)await placeImage(f)};
$("#ipaste").onclick=async()=>{
  try{
    const its=await navigator.clipboard.read();
    for(const it of its){const t=it.types.find(x=>x.startsWith("image/"));if(t){await placeImage(await it.getType(t));return}}
    toast("No image in the clipboard");
  }catch(e){toast("Paste blocked — use Choose, or press Ctrl+V")}
};
addEventListener("paste",e=>{
  if(!pdf||!views.length)return;
  const its=e.clipboardData&&e.clipboardData.items;if(!its)return;
  for(const it of its){
    if(it.kind==="file"&&it.type.startsWith("image/")){const f=it.getAsFile();if(f){e.preventDefault();placeImage(f);return}}
  }
});

// eraser mode
function syncEm(){$("#em0").classList.toggle("on",P.emode==="stroke");$("#em1").classList.toggle("on",P.emode==="pixel")}
$("#em0").onclick=()=>{P.emode="stroke";savePrefs();syncEm()};
$("#em1").onclick=()=>{P.emode="pixel";savePrefs();syncEm()};
syncEm();

// A- / A+
const key=()=>tool==="er"?"er":tool==="hl"?"hl":"pen";
function bump(d){
  if(tool==="im"){if(editor&&editor.scale)editor.scale(d>0?1.1:1/1.1);else toast("Tap an image first");return}
  if(tool==="tx"){const pt=clamp(Math.round(txf.size*PW)+d*2,4,300);tset({size:pt/PW});toast("Font "+pt+" pt");return}
  const k=key(),r=RG[k];P[k]=clamp(P[k]*(d>0?1.25:0.8),r[0],r[1]);savePrefs();syncPP();
  toast("Size "+toPct(k)+"%");
}
$("#szm").onclick=()=>bump(-1);$("#szp").onclick=()=>bump(1);

// ---- text toolbar
function syncTb(){$("#tfont").value=txf.font;$("#tsize").value=Math.round(txf.size*PW);
  ["b","i","u"].forEach(k=>$("#t"+k).classList.toggle("on",!!txf[k]))}
function tset(p){Object.assign(txf,p);syncTb();if(editor)editor.set({...p})}
$("#tfont").onchange=e=>tset({font:e.target.value});
$("#tsize").oninput=e=>{const v=+e.target.value;if(v>=4&&v<=300){txf.size=v/PW;if(editor)editor.set({size:v/PW})}};
$("#tb").onclick=()=>tset({b:txf.b?0:1});
$("#ti").onclick=()=>tset({i:txf.i?0:1});
$("#tu").onclick=()=>tset({u:txf.u?0:1});
$("#bar").addEventListener("pointerdown",e=>{if(editor&&e.target.closest("button"))e.preventDefault()});
syncTb();

// ---- pen settings panel (+ practice pad)
const toPct=k=>{const[a,b]=RG[k];return Math.round(Math.log(P[k]/a)/Math.log(b/a)*100)};
function syncPP(){
  const k=key();
  $("#pSize").value=toPct(k);
  $("#lSize").textContent=k==="er"?"Eraser size":k==="hl"?"Highlighter thickness":"Pen thickness";
  $("#pSm").value=Math.round(P.smooth*100);$("#pPr").value=Math.round(P.press*100);
}
$("#pSize").oninput=e=>{const k=key(),[a,b]=RG[k];P[k]=a*Math.pow(b/a,e.target.value/100);savePrefs()};
$("#pSm").oninput=e=>{P.smooth=e.target.value/100;savePrefs()};
$("#pPr").oninput=e=>{P.press=e.target.value/100;savePrefs()};
$("#prst").onclick=()=>{Object.assign(P,{pen:PD.pen,hl:PD.hl,er:PD.er,smooth:PD.smooth,press:PD.press});savePrefs();syncPP()};
$("#cfg").onclick=()=>{
  const h=$("#pp").classList.toggle("hide");
  if(!h){syncPP();pinAll();padSize();padRedraw()}
};
$("#ppx").onclick=()=>$("#pp").classList.add("hide");
const pad=$("#pad"),pctx=pad.getContext("2d");let padS=[],padCur=null;
function padSize(){const d=devicePixelRatio||1;pad.width=Math.max(1,pad.clientWidth*d);pad.height=Math.max(1,pad.clientHeight*d)}
function padRedraw(){
  pctx.clearRect(0,0,pad.width,pad.height);
  const k=(views.length?views[0].cw:600)*(devicePixelRatio||1)/pad.width;
  padS.concat(padCur?[padCur]:[]).forEach(s=>line(pctx,{...s,w:s.w*k,ws:s.ws&&s.ws.map(x=>x*k)},pad.width,pad.height,false));
}
const padPos=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
pad.addEventListener("pointerdown",e=>{
  e.preventDefault();pad.setPointerCapture(e.pointerId);
  padCur=mkStroke(tool==="hl"?"hl":"pen",0);addPt(padCur,padPos(e),e.pressure>0?e.pressure:0.5);padRedraw();
});
pad.addEventListener("pointermove",e=>{
  if(!padCur)return;
  for(const ev of(e.getCoalescedEvents?e.getCoalescedEvents():[e]))addPt(padCur,padPos(ev),ev.pressure>0?ev.pressure:0.5);
  padRedraw();
});
const padEnd=()=>{if(!padCur)return;catchUp(padCur);padS.push(padCur);padCur=null;padRedraw()};
pad.addEventListener("pointerup",padEnd);pad.addEventListener("pointercancel",padEnd);
$("#pclr").onclick=()=>{padS=[];padRedraw()};

// ---- undo / zoom / files
$("#undo").onclick=undo;
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!(e.target.matches&&e.target.matches("textarea,input"))){e.preventDefault();undo()}});
$("#zi").onclick=()=>{zoom=Math.min(3,zoom+.25);render()};$("#zo").onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};
$("#files").onclick=()=>{closeText();if(!pending()||confirm("Discard unsaved ink?")){strokes=[];deletes=[];hist=[];browse(cur?cur.split("/").slice(0,-1).join("/"):"")}};

const payload=s=>s.kind==="text"
  ?{kind:"text",page:s.page,color:s.color,x:s.x,y:s.y,wd:s.wd,size:s.size,text:s.text,font:s.font||"helv",b:s.b?1:0,i:s.i?1:0,u:s.ul?1:0}
  :s.kind==="img"
  ?{kind:"img",page:s.page,x:s.x,y:s.y,wd:s.wd,ht:s.ht,data:s.data}
  :{page:s.page,color:s.color,w:s.w,a:s.a,pts:s.pts.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)])};

async function save(manual){
  if(!pending())return manual===true&&toast("Nothing new to save");
  if(drawing||busy){clearTimeout(saveTimer);saveTimer=setTimeout(save,1500);return}
  busy=true;
  const nw=strokes.filter(s=>!s.saved),dl=deletes.slice();inflightDel=dl;
  let flat=false;
  try{
    const r=await fetch("/api/save?path="+encodeURIComponent(cur),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({strokes:nw.map(payload),delete:dl})});
    if(!r.ok)throw new Error(r.status===413?"too large (raise the proxy upload limit)":r.status);
    const j=await r.json().catch(()=>({})),xr=j.xrefs||[];
    dl.forEach(x=>xmap.delete(x));
    deletes=deletes.filter(x=>!dl.includes(x));
    const failed=new Set();
    nw.forEach((s,k)=>{
      const x=xr[k];
      if(x==null){failed.add(s.u);return}
      if(x===-1){flat=true;failed.add(s.u);return}      // picture was merged into the page itself
      const c=strokes.find(t=>t.u===s.u);
      if(c){c.saved=true;c.xref=x;xmap.set(x,s.u)}
      else deletes.push(x);                              // removed while saving: delete the server copy too
    });
    if(failed.size)strokes=strokes.filter(s=>!failed.has(s.u));
    if(j.m)lastM=j.m;                                     // no re-download after saving
    if(flat){
      pdf=await pdfjsLib.getDocument("/api/file?path="+encodeURIComponent(cur)+"&t="+Date.now()).promise;
      await render();
    }
    dirty();
    toast(flat?"Saved (an image was merged into the page and can't be moved again)":j.failed?"Saved, but "+j.failed+" item(s) failed":"Saved");
  }catch(e){toast("Save failed: "+e.message);inflightDel=[];busy=false;return}
  inflightDel=[];busy=false;
  if(pending())schedSave();
}
$("#save").onclick=()=>save(true);

// ---- round pen/eraser button: drag it anywhere, tap it to switch
let flipPrev="pen";
const flipTool=()=>{if(tool==="er")setTool(flipPrev);else{flipPrev=tool;setTool("er")}};
(()=>{
  const f=$("#flip");let d=null;
  f.addEventListener("mousedown",e=>e.preventDefault());
  f.addEventListener("pointerdown",e=>{e.preventDefault();f.setPointerCapture(e.pointerId);d={sx:e.clientX,sy:e.clientY,m:false}});
  f.addEventListener("pointermove",e=>{
    if(!d)return;
    if(!d.m&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>8)d.m=true;
    if(d.m){
      const vv=window.visualViewport,sc=vv?vv.scale:1,ox=vv?vv.offsetLeft:0,oy=vv?vv.offsetTop:0,
            vw=vv?vv.width:innerWidth,vh=vv?vv.height:innerHeight,fw=64/sc;
      fpos.x=clamp((e.clientX-ox-fw/2)/(vw-fw),0,1);fpos.y=clamp((e.clientY-oy-fw/2)/(vh-fw),0,1);
      pinAll();
    }
  });
  f.addEventListener("pointerup",()=>{if(!d)return;const m=d.m;d=null;if(m)savePrefs();else flipTool()});
  f.addEventListener("pointercancel",()=>{d=null});
})();

// ---- page indicator / navigation
let rq=0,lastPg="";
function curPage(){
  let best=0,bv=-1;const H=innerHeight;
  for(let i=0;i<views.length;i++){
    const r=views[i].wrap.getBoundingClientRect();
    if(r.top>H)break;
    const vis=Math.min(r.bottom,H)-Math.max(r.top,0);
    if(vis>bv){bv=vis;best=i}
  }
  return best;
}
function updPg(){
  if(!views.length)return;
  const i=curPage(),t=`Pages ${i+1}/${views.length}`;
  if(t!==lastPg){lastPg=t;$("#pgs").textContent=t;$("#dkPg").classList.toggle("on",isDark(i))}
}
addEventListener("scroll",()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;updPg()})},{passive:true});
function goPage(i){const el=views[i]&&views[i].wrap;if(!el)return;
  scrollTo({top:el.getBoundingClientRect().top+scrollY-$("#bar").offsetHeight-8})}

// ---- page management
async function flush(){
  closeText();clearTimeout(saveTimer);
  for(let k=0;k<50&&(busy||drawing);k++)await new Promise(r=>setTimeout(r,100));
  if(pending())await save();
  return !pending();
}
async function pageOp(body){
  if(pgBusy)return false;pgBusy=true;
  try{
    if(!await flush()){toast("Couldn't save your ink first — try again");return false}
    busy=true;
    const r=await fetch("/api/pages?path="+encodeURIComponent(cur),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    pdf=await pdfjsLib.getDocument("/api/file?path="+encodeURIComponent(cur)+"&t="+Date.now()).promise;
    xmap.clear();imgData.clear();hist=[];strokes=[];darkPg.clear();saveDP();
    strokes=merge(await pull());lastM=j.m;
    await render();
    if(!$("#pm").classList.contains("hide"))await thumbs();
    return true;
  }catch(e){toast("Page action failed: "+e.message);return false}
  finally{busy=false;pgBusy=false}
}
async function thumbs(){
  const tok=++thumbTok,g=$("#grid");g.innerHTML="";
  const n=pdf.numPages;
  for(let k=1;k<=n;k++){
    const i=k-1,c=document.createElement("div");c.className="cell";
    c.innerHTML=`<div class="cv"></div><div>Page ${k}</div><div>
      <button data-a="L" data-i="${i}" title="Move earlier" ${i?"":"disabled"}>◀</button>
      <button data-a="R" data-i="${i}" title="Move later" ${i<n-1?"":"disabled"}>▶</button>
      <button data-a="A" data-i="${i}" title="Add page after">＋</button>
      <button data-a="D" data-i="${i}" title="Delete page" ${n>1?"":"disabled"}>🗑</button></div>`;
    g.append(c);
  }
  for(let k=1;k<=n;k++){
    const page=await pdf.getPage(k);if(tok!==thumbTok)return;
    const v0=page.getViewport({scale:1}),vp=page.getViewport({scale:300/v0.width});
    const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;cv.dataset.i=k-1;
    const ctx=cv.getContext("2d");
    await page.render({canvasContext:ctx,viewport:vp,annotationMode:0}).promise;if(tok!==thumbTok)return;
    await Promise.all(strokes.filter(s=>s.page===k-1&&s.kind==="img").map(ready));if(tok!==thumbTok)return;
    paint(ctx,k-1,vp.width,vp.height,false);
    const slot=g.children[k-1]&&g.children[k-1].querySelector(".cv");if(slot)slot.append(cv);
  }
}
$("#pgs").onclick=async()=>{closeText();$("#pm").classList.remove("hide");pinAll();await thumbs()};
$("#pclose").onclick=()=>{$("#pm").classList.add("hide");thumbTok++;$("#grid").innerHTML=""};
$("#padd").onclick=()=>pageOp({action:"add",index:pdf.numPages-1,template:$("#ptpl").value});
$("#qadd").onclick=async()=>{const i=curPage();if(await pageOp({action:"add",index:i,template:$("#ptpl").value}))goPage(i+1)};
$("#grid").onclick=async e=>{
  const b=e.target.closest("button"),cv=e.target.closest("canvas");
  if(cv&&!b){$("#pm").classList.add("hide");thumbTok++;$("#grid").innerHTML="";goPage(+cv.dataset.i);return}
  if(!b||b.disabled)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==="L")await pageOp({action:"move",index:i,to:i-1});
  else if(a==="R")await pageOp({action:"move",index:i,to:i+1});
  else if(a==="A")await pageOp({action:"add",index:i,template:$("#ptpl").value});
  else if(a==="D"&&confirm("Delete page "+(i+1)+"? This can't be undone."))await pageOp({action:"delete",index:i});
};

// pick up ink saved from another device
setInterval(async()=>{
  if(!cur||!pdf||busy||drawing||pending()||document.hidden)return;
  try{
    const j=await (await fetch("/api/mtime?path="+encodeURIComponent(cur))).json();
    if(j.m===lastM)return;
    const old=lastM,p=await pull();
    if(busy||drawing||pending()){lastM=old;return}
    strokes=merge(p);redrawAll();
  }catch(e){}
},4000);
addEventListener("beforeunload",e=>{if(pending()){e.preventDefault();e.returnValue=""}});
syncDk();pinAll();browse("");
